name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build and Run C and C++ Tests, Demos, and Examples
      run: |
        cd code
        make
        make test
        make run
        make examples
        make clean
